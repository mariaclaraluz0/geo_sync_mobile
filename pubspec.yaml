name: mobile
description: "Aplicativo offline-first para rastreamento e gestão de entregas."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  http: ^1.3.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^13.0.2
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  file_selector: ^1.1.0
  lucide_icons_flutter: ^3.1.20
  flutter_secure_storage: ^11.2.0
  cupertino_icons: ^2.0.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
